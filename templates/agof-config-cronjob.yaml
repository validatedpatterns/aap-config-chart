{{- if not $.Values.configJob.disabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agof-config-cronjob
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  schedule: {{ $.Values.configJob.schedule | quote }}
  # if previous Job is still running, skip execution of a new Job
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # A drain-evicted (cancelled) pod is ignored rather than counted as a
      # failure; only genuine failures count toward backoffLimit.
      # No containerName: both the agof-init (bash) and agof-config
      # (timeout-wrapped make) containers exit 143 on SIGTERM.
      podFailurePolicy:
        rules:
          - action: Ignore
            onExitCodes:
              operator: In
              values: [143]
          - action: Ignore
            onPodConditions:
              - type: DisruptionTarget
      template:
        spec:
          activeDeadlineSeconds: {{ $.Values.configJob.activeDeadlineSeconds }}
          {{- include "aap-config.app.configjobspec" $ | nindent 10 }}
{{- end }}{{/* if not $.Values.configJob.disabled */}}
